name: Run Weather Scraper And Cache
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
 
jobs:
  get_weather:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Scraper
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-artifacts
          path: |
            playwright-report/
            weather-forecasts/
          retention-days: 30
      - name: Cache CSVs
        id: cache-primes
        uses: actions/cache@v4
        with:
          path: weather-forecasts/
          key: weather-forecasts